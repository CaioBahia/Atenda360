spring.application.name=Atenda360 API
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/atenda360}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

atenda360.jwt.secret=${JWT_SECRET:QXRlbmRhMzYwLWRlc2Vudm9sdmltZW50by1jaGF2ZS1zZWNyZXRhLTIwMjY=}
atenda360.jwt.expiration=28800000

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
